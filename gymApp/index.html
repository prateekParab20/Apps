<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StrongLean">
  <meta name="description" content="StrongLean is a calm strength trainer for routines, sets, rest, and progress. Everything stays on this device.">
  <title>StrongLean</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light') document.documentElement.classList.add('light');
        else if (t === 'dark') document.documentElement.classList.add('dark');
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', dark ? '#000000' : '#f2f2f7');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app">
    <main id="view" class="app-main"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <div id="restbar" class="restbar" hidden></div>
  <div id="overlay"></div>
  <div id="dialog"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="library.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
